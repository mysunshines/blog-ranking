# ============================================================
# ranking-service 配置（本地开发环境 / development）
# ------------------------------------------------------------
# 端口段：HTTP 8086 / gRPC 9106 / Metrics 9097
# 时间单位：expire_time / *_sec / *_ttl 统一为「秒」
# 段落顺序：app → grpc → http → database → redis → jwt → consul
#          → metrics → rate_limit → server → loki → otel
# ============================================================

app:
  name: "ranking-service"
  env: "development"
  log_dir: "./logs"
  log_level: "info"

grpc:
  host: "0.0.0.0"
  port: 9106

http:
  host: "0.0.0.0"
  port: 8086

# 只读共享 blog 库（reconcile 与读路径回填的数据源）
database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "root123"
  name: "blog"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 3600

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 100

jwt:
  secret: "your-secret-key-change-in-production"
  expire_time: 604800  # 秒；7 天

consul:
  address: "localhost:8500"
  check_interval: 10
  deregister_critical: 30

metrics:
  enabled: true
  path: "/metrics"
  port: 9097

rate_limit:
  enabled: true
  qps: 2000
  burst: 4000

server:
  grpc:
    default_timeout_sec: 10
    max_connection_idle_sec: 60
    max_connection_age_sec: 120
    max_connection_age_grace_sec: 30
    min_ping_interval_sec: 30
    max_concurrent_streams: 100
  http:
    read_timeout_sec: 30
    read_header_timeout_sec: 10
    write_timeout_sec: 30
    idle_timeout_sec: 120
    default_timeout_sec: 30

# 出站韧性策略由配置中心（Consul KV HotConfig.resilience）下发热更；
# gRPC 入站熔断器参数固定为 3 / 10s / 30s。
# RANKING_RECONCILE_SEC 环境变量控制榜单对账间隔（默认 30s）。

loki:
  enabled: false
  url: "http://loki:3100/loki/api/v1/push"
  tenant_id: ""

otel:
  enabled: false
  endpoint: "otel-collector:4317"
